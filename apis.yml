aid: rgenta-therapeutics
name: Rgenta Therapeutics
description: >-
  Rgenta Therapeutics is a clinical-stage biotechnology company headquartered at 300 TradeCenter,
  Woburn, Massachusetts, developing a pipeline of oral, small-molecule RNA-targeting medicines with
  an initial focus on oncology and neurological disorders. Its discovery platform mines large-scale
  genomics data to identify targetable RNA processing events, then designs small molecules that
  modulate the interactions among the spliceosome, RNA-binding regulatory proteins and RNA itself in
  order to shut down production of disease-driving proteins previously considered undruggable. Its
  lead clinical asset, RGT-61159, is an orally available modulator of MYB splicing in development for
  adenoid cystic carcinoma and colorectal cancer, and its RSwitch technology applies the same
  chemistry to tune transgene expression in AAV-delivered gene and cell therapies. Rgenta is a
  therapeutics developer, not a software vendor: it publishes no API, no developer portal and no
  machine-readable API contract of any kind.
